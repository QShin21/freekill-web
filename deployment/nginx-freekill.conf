server {
  listen 80;
  listen [::]:80;
  server_name zijing.yejiaxin.online ws.zijing.yejiaxin.online;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name zijing.yejiaxin.online ws.zijing.yejiaxin.online;

  ssl_certificate /etc/letsencrypt/live/zijing.yejiaxin.online/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/zijing.yejiaxin.online/privkey.pem;

  # The Node gateway also protects directly-served static files with these
  # headers. Hide its copies before adding the public response headers below:
  # duplicate COOP/COEP fields are combined into an invalid policy by browsers,
  # which disables SharedArrayBuffer and prevents the threaded Wasm build from
  # starting.
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header Cross-Origin-Opener-Policy;
  proxy_hide_header Cross-Origin-Embedder-Policy;
  proxy_hide_header Cross-Origin-Resource-Policy;
  proxy_hide_header Content-Security-Policy;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Embedder-Policy require-corp always;
  add_header Cross-Origin-Resource-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  location = /ws {
    proxy_pass http://127.0.0.1:9580;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
  }

  location / {
    proxy_pass http://127.0.0.1:9580;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
